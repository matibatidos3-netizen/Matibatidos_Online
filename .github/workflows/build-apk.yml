name: Construir APK Matibatidos Online

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar proyecto Android
        id: locate
        shell: bash
        run: |
          set -e

          echo "Buscando settings.gradle..."

          PROJECT_FILE=$(find . \
            -type f \
            -name settings.gradle \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Buscando ZIP del proyecto..."

            ZIP_FILE=$(find . \
              -type f \
              -iname 'Matibatidos-Online-Proyecto-GitHub.zip' \
              -not -path './.git/*' \
              | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No se encontró el proyecto ni su ZIP."
              find . -maxdepth 6 -type f | sort
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/matibatidos-source"
            unzip -o "$ZIP_FILE" \
              -d "$RUNNER_TEMP/matibatidos-source"

            PROJECT_FILE=$(find \
              "$RUNNER_TEMP/matibatidos-source" \
              -type f \
              -name settings.gradle \
              | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: El proyecto no contiene settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(realpath "$(dirname "$PROJECT_FILE")")

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Preparar SDK de Android
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            find "$ANDROID_HOME" -maxdepth 5 -type f \
              -name sdkmanager
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar estructura del proyecto
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/matibatidos/online/MainActivity.java"
            "app/src/main/assets/www/index.html"
            "app/src/main/assets/www/styles.css"
            "app/src/main/assets/www/app.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "ERROR: Falta $FILE"
              exit 1
            fi
          done

          echo "Estructura verificada correctamente."

      - name: Verificar herramientas
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Compilar APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Comprobar APK generada
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: No se generó la APK."
            exit 1
          fi

          echo "APK generada correctamente."
          ls -lh "$APK"

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-Online-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
