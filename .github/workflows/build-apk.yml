name: Construir APK Matibatidos Online

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar proyecto Android
        id: locate
        shell: bash
        run: |
          echo "Buscando proyecto..."

          FILE=$(find . -maxdepth 8 \
            -type f \
            -name settings.gradle \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find . -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR="${PROJECT_DIR#./}"
          fi

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar archivos
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/matibatidos/online/MainActivity.java"
            "app/src/main/assets/www/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "CORRECTO: $FILE"
            else
              echo "ERROR: Falta $FILE"
              exit 1
            fi
          done

      - name: Compilar aplicación Android
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se generó la APK"
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-Online-APK
          path: ${{ github.workspace }}/${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
